<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atom Builder</title>

<style>
body {
  font-family: Arial;
  margin: 20px;
}

.card {
  border: 1px solid #ccc;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 10px;
}

button {
  padding: 10px;
  margin: 5px;
}
</style>
</head>

<body>

<h1>Build an Atom</h1>

<div class="card">
<h2>Key Idea</h2>
<ul>
  <li>Proton → positive (+)</li>
  <li>Neutron → no charge</li>
  <li>Electron → negative (−)</li>
</ul>

<p><strong>An atom is neutral when:</strong> protons = electrons</p>
</div>

<div class="card">
<h2>Build the Atom</h2>

<label>Protons:</label>
<input type="number" id="p" value="6"><br>

<label>Neutrons:</label>
<input type="number" id="n" value="6"><br>

<label>Electrons:</label>
<input type="number" id="e" value="6"><br>

<button onclick="update()">Update Atom</button>

<p id="result"></p>
<div class="card">
<h2>Say It</h2>

<p>This atom has <span id="sp">6</span> protons and 
<span id="se">6</span> electrons.</p>

<p>The atom is <span id="stype">neutral</span>.</p>

</div>
  
</div>

<div class="card">
<h2>Try This</h2>

<button onclick="task(6,6,6)">Neutral Atom</button>
<button onclick="task(6,6,5)">Positive Ion</button>

<p id="feedback"></p>

</div>

<script>

function update() {
  let p = Number(document.getElementById("p").value);
  let e = Number(document.getElementById("e").value);

  let charge = p - e;

  let text = "";

  if (charge === 0) {
    text = "This atom is neutral.";
  } else if (charge > 0) {
    text = "This atom is positive.";
  } else {
    text = "This atom is negative.";
  }

  document.getElementById("result").innerText =
    "Protons: " + p + " | Electrons: " + e + " → Charge: " + charge + "\n" + text;
}

function task(p, n, e) {
  document.getElementById("p").value = p;
  document.getElementById("n").value = n;
  document.getElementById("e").value = e;

  update();

  if (p === e) {
    document.getElementById("feedback").innerText =
      "Correct: This atom is neutral.";
  } else if (p > e) {
    document.getElementById("feedback").innerText =
      "Correct: This atom is positive.";
  } else {
    document.getElementById("feedback").innerText =
      "Correct: This atom is negative.";
  }
}

update();
function update() {
  let p = Number(document.getElementById("p").value);
  let e = Number(document.getElementById("e").value);

  let charge = p - e;
  let type = "";

  if (charge === 0) {
    type = "neutral";
  } else if (charge > 0) {
    type = "positive";
  } else {
    type = "negative";
  }

  document.getElementById("result").innerText =
    "Protons: " + p + " | Electrons: " + e + " → Charge: " + charge;

  // ✅ NEW: update sentence frame
  document.getElementById("sp").innerText = p;
  document.getElementById("se").innerText = e;
  document.getElementById("stype").innerText = type;
}  

</script>

</body>
</html>
