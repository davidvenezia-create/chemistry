<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build an Atom | Chemistry Explorer</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #4b5563;
      --border: #dbe3ee;
      --accent: #2563eb;
      --accent-2: #0f766e;
      --accent-3: #7c3aed;
      --success: #166534;
      --success-bg: #dcfce7;
      --warn: #92400e;
      --warn-bg: #fef3c7;
      --danger: #991b1b;
      --danger-bg: #fee2e2;
      --soft-blue: #e8f0ff;
      --soft-green: #e8fff3;
      --soft-purple: #f2ebff;
      --shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f9fbfe 0%, #eef4fb 100%);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #1d4ed8, #0f766e);
      color: white;
      padding: 28px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.2;
    }

    header p {
      margin: 0;
      max-width: 900px;
      font-size: 1rem;
      opacity: 0.98;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .notice {
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin: 20px 0;
    }

    .notice strong {
      color: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 18px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      line-height: 1.3;
    }

    .card h3 {
      margin: 18px 0 8px;
      font-size: 1rem;
      color: var(--accent-2);
    }

    .small-label {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent-3);
      margin-bottom: 8px;
    }

    ul {
      padding-left: 20px;
      margin: 8px 0 0;
    }

    li {
      margin-bottom: 6px;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .word {
      background: var(--soft-purple);
      color: #4c1d95;
      border: 1px solid #ddd6fe;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.95rem;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }

    .controls {
      display: grid;
      gap: 16px;
    }

    .control-group {
      background: #fbfdff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .control-header label {
      font-weight: bold;
    }

    .number-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: white;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }

    .mini-btn:hover {
      background: #f3f6fb;
    }

    input[type="number"] {
      width: 72px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      text-align: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .helper {
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .summary-box {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fbfdff;
    }

    .summary-box .label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .summary-box .value {
      font-size: 1.15rem;
      font-weight: bold;
    }

    .callout {
      margin-top: 14px;
      border-radius: 14px;
      padding: 14px;
      border: 1px solid transparent;
    }

    .neutral {
      background: var(--success-bg);
      color: var(--success);
      border-color: #bbf7d0;
    }

    .positive {
      background: var(--warn-bg);
      color: var(--warn);
      border-color: #fde68a;
    }

    .negative {
      background: #e0f2fe;
      color: #075985;
      border-color: #bae6fd;
    }

    .atom-panel {
      display: grid;
      gap: 12px;
    }

    .atom-stage {
      position: relative;
      min-height: 420px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: radial-gradient(circle at center, #ffffff 0%, #f7fbff 58%, #eef6ff 100%);
      overflow: hidden;
    }

    .orbit {
      position: absolute;
      border: 2px dashed #c7d7ef;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .orbit-label {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 0.86rem;
      color: var(--muted);
      background: rgba(255,255,255,0.85);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .nucleus {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 120px;
      height: 120px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffbe7, #fde68a);
      border: 2px solid #f59e0b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px;
      box-shadow: 0 10px 24px rgba(245, 158, 11, 0.15);
      z-index: 3;
    }

    .nucleus strong {
      font-size: 1rem;
    }

    .nucleus span {
      font-size: 0.88rem;
    }

    .electron {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #60a5fa 45%, #2563eb 100%);
      border: 2px solid #1d4ed8;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
      z-index: 4;
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
